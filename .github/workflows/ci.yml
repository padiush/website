name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting (Prettier)
        run: npm run format:check
      - name: Check types (astro check)
        run: npm run check
      - name: Run tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
