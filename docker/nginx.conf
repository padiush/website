# Serves the built site for local preview, the way production serves it:
# pages without a trailing slash, each from its directory's index.html, and
# long-lived caching for the fingerprinted assets under /_site/.
server {
    listen 80;
    root /usr/share/nginx/html;

    absolute_redirect off;

    location ^~ /_site/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        rewrite ^(/.+)/$ $1 permanent;
        try_files $uri $uri/index.html =404;
    }
}
